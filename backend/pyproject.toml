[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-stock-analysis-system"
version = "0.1.0"
description = "AI-assisted investment research and portfolio decision-support platform"
requires-python = ">=3.12"

[tool.black]
line-length = 99
target-version = ["py312"]

[tool.ruff]
line-length = 99
target-version = "py312"
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "DJ"]
ignore = ["E501", "DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "apps", "config", "llm"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests", "apps"]
markers = [
    "integration: requires infrastructure beyond the test database",
]

[tool.coverage.run]
branch = true
source = ["agents", "apps", "engines", "llm", "ml", "rules"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
