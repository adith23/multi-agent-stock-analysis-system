# ============================================
# Multi-Agent Stock Analysis System
# Docker Compose — NOT USED FOR DEVELOPMENT
# ============================================
#
# This project uses cloud-managed services for all infrastructure:
#
#   PostgreSQL  → Neon          (https://neon.tech)
#   MongoDB     → Atlas         (https://mongodb.com/atlas)
#   Redis       → Redis Cloud   (https://redis.io/cloud)
#   Kafka       → Confluent     (https://confluent.io/confluent-cloud)
#
# No Docker is required for local development.
# See BACKEND_SETUP_GUIDE.md → Section 2 for setup instructions.
#
# This file is kept as a reference for future Docker-based deployments
# (e.g., CI/CD pipelines or self-hosted environments).
# ============================================

# To use local Docker services instead of cloud:
# 1. Uncomment the services below
# 2. Update your .env with localhost connection strings
# 3. Run: docker compose up -d

