name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "docker/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockanalysis_test
          POSTGRES_USER: stockanalysis
          POSTGRES_PASSWORD: stockanalysis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockanalysis -d stockanalysis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DJANGO_SECRET_KEY: ci-only-secret
      TEST_DATABASE_URL: postgresql://stockanalysis:stockanalysis@localhost:5432/stockanalysis_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: black --check .
      - name: Validate Django configuration
        run: python manage.py check
      - name: Verify committed migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Validate OpenAPI contract
        run: python manage.py spectacular --file openapi.yaml --validate
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Test
        run: pytest --cov --cov-report=term-missing
